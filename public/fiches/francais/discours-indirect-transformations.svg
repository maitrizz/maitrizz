<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" role="img" aria-label="Passage du discours direct au discours indirect : trois transformations s'appliquent en même temps, sur les pronoms, les temps verbaux et les repères de temps et de lieu.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    .tag { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: .04em; fill: #0f766e; }
    .sent { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #0f172a; }
    .cat { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700; fill: #0f766e; }
    .map { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #0f172a; }
    .sub { font-family: ui-sans-serif, system-ui, sans-serif; font-style: italic; fill: #475569; }
    .axis { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700; letter-spacing: .08em; fill: #0d9488; }
  </style>

  <!-- Discours direct (haut) -->
  <rect x="130" y="20" width="510" height="60" rx="12" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text class="tag" x="148" y="42" font-size="12">DISCOURS DIRECT</text>
  <text class="sent" x="148" y="66" font-size="17">« Je partirai demain », déclara-t-il.</text>

  <!-- Axe de transformation -->
  <line x1="70" y1="84" x2="70" y2="306" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="axis" transform="rotate(-90 70 196)" x="70" y="196" text-anchor="middle" font-size="12">PASSAGE AU DISCOURS INDIRECT</text>

  <!-- 1 · Pronoms -->
  <rect x="118" y="90" width="522" height="58" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <text class="cat" x="138" y="124" font-size="15">1 · Pronoms</text>
  <text class="map" x="300" y="114" font-size="15">« je » → « il »</text>
  <text class="sub" x="300" y="134" font-size="12">la personne suit le locuteur</text>

  <!-- 2 · Temps -->
  <rect x="118" y="156" width="522" height="58" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <text class="cat" x="138" y="190" font-size="15">2 · Temps</text>
  <text class="map" x="300" y="180" font-size="15">« partirai » → « partirait »</text>
  <text class="sub" x="300" y="200" font-size="12">futur → conditionnel (verbe introducteur au passé)</text>

  <!-- 3 · Repères -->
  <rect x="118" y="222" width="522" height="58" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <text class="cat" x="138" y="256" font-size="15">3 · Repères</text>
  <text class="map" x="300" y="246" font-size="15">« demain » → « le lendemain »</text>
  <text class="sub" x="300" y="266" font-size="12">repère relatif au récit, non à l'énonciation</text>

  <!-- Discours indirect (bas) -->
  <rect x="130" y="312" width="510" height="60" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text class="tag" x="148" y="334" font-size="12">DISCOURS INDIRECT</text>
  <text class="sent" x="148" y="358" font-size="17">Il déclara qu'il partirait le lendemain.</text>
</svg>
