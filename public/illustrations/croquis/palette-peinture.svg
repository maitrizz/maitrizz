<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Une palette de peintre avec son pinceau.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- palette : deux passages qui se chevauchent -->
    <path d="M22 38 C 20 24 34 13 50 14 C 60 14.6 68 18.5 72 24.5" stroke-width="3.4"/>
    <path d="M70.5 22 C 74.5 27.5 75.5 33.5 74 38 C 71 49.5 59.5 57 44 56 C 32.5 55 24.5 49 22.3 39.5" stroke-width="2.4"/>
    <!-- reprise sur le bord bas -->
    <path d="M32 52 C 36.5 53.8 41.5 54.8 46 54.8" stroke-width="1.3" opacity=".55"/>
    <!-- trou du pouce, plus léger -->
    <circle cx="58" cy="42" r="4.5" stroke-width="2"/>
    <!-- touches de couleur en terracotta, pression variable -->
    <g stroke="#c36648">
      <circle cx="35" cy="30" r="2.5" stroke-width="2.4"/>
      <circle cx="45" cy="24" r="2.5" stroke-width="1.8"/>
      <circle cx="56" cy="26" r="2.5" stroke-width="2.4"/>
    </g>
    <!-- pinceau : manche épais, virole fine, touffe -->
    <path d="M83 7 L 66 28" stroke-width="3.4"/>
    <path d="M68.5 25 L 63 31.5" stroke-width="2"/>
    <path d="M64 30 C 62 33 60 34 57 34 C 58 31 60 29 62 28 Z" stroke-width="2.2"/>
    <!-- hachures d'ombre sous la palette -->
    <path d="M34 61 L 38 59 M41 61.5 L 45 59.5 M48 61 L 52 59" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
