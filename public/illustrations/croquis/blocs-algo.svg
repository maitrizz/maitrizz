<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Des blocs d'instructions reliés par une flèche.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- premier bloc : quatre traits qui se croisent aux coins -->
    <path d="M18 10.5 C 18 17 18 23.5 19 31.5" stroke-width="3.2"/>
    <path d="M16.5 12 C 30 11 45 11 60.5 12" stroke-width="2.2"/>
    <path d="M59 10.5 C 60 17 60 23.5 59 31.5" stroke-width="3.2"/>
    <path d="M16.5 30 C 30 31 45 31 60.5 30" stroke-width="2.2"/>
    <!-- reprise sur le premier bloc -->
    <path d="M18.5 15 C 18.3 20 18.5 24 18.4 27" stroke-width="1.3" opacity=".55"/>
    <!-- second bloc -->
    <path d="M37 36.5 C 37 43 37 49.5 38 57.5" stroke-width="3.2"/>
    <path d="M35.5 38 C 49 37 63 37 78.5 38" stroke-width="2.2"/>
    <path d="M77 36.5 C 78 43 78 49.5 77 57.5" stroke-width="3.2"/>
    <path d="M35.5 56 C 49 57 63 57 78.5 56" stroke-width="2.2"/>
    <!-- lignes d'instruction esquissées -->
    <path d="M25 21 C 31 20.5 38 21 44 20.7" stroke-width="1.8"/>
    <path d="M44 47 C 50 46.5 57 47 63 46.7" stroke-width="1.8"/>
    <!-- la flèche qui relie, en terracotta appuyée -->
    <g stroke="#c36648" stroke-width="2.8">
      <path d="M64 30 C 70 32 72 34 71 38"/>
      <path d="M71 38 L 66 35 M71 38 L 74 33"/>
    </g>
    <!-- hachures d'ombre sous le second bloc -->
    <path d="M44 61.5 L 48 59.5 M51 62 L 55 60" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
