<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Un compas qui trace un arc.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- la tête et la molette -->
    <circle cx="48" cy="13" r="4" stroke-width="2.4"/>
    <path d="M48 3.5 L 48 9" stroke-width="3.2"/>
    <!-- les deux branches : la porteuse épaisse, la traçante plus fine -->
    <path d="M46 16.5 C 42 30 37 43 31.5 56" stroke-width="3.4"/>
    <path d="M50 16.5 C 54 30 59 43 64.5 56" stroke-width="2.4"/>
    <!-- reprise sur la branche gauche -->
    <path d="M44.5 22 C 43 26.5 41.5 31 40 35.5" stroke-width="1.3" opacity=".55"/>
    <!-- la pointe et la mine, appuyées -->
    <path d="M32 55 L 31 61.5" stroke-width="3.2"/>
    <path d="M64 55 L 66 61.5" stroke-width="3.2"/>
    <!-- l'arc tracé, en terracotta -->
    <path d="M26 62 C 39 66 57 66 70 62" stroke="#c36648" stroke-width="2.6" stroke-dasharray="1 8"/>
    <!-- hachures d'ombre entre les branches -->
    <path d="M43 50 L 47 48 M50 50.5 L 54 48.5" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
