<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Deux bulles de dialogue, une question et une réponse.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- bulle du jury : deux passages qui ne se referment pas exactement -->
    <path d="M13 10.5 C 21 9.5 29.5 8.8 37 9.8 C 43.5 10 46.3 14 46.2 21 C 46.2 27.5 45.3 33.5 42.5 34.8" stroke-width="3.4"/>
    <path d="M44 35 C 33.5 37.3 20.5 37.2 12.3 34.3 C 10.2 27.3 10.3 19 12 11.8" stroke-width="2.2"/>
    <!-- queue de la bulle -->
    <path d="M18 35 L 14 45 L 26 36" stroke-width="2.4"/>
    <!-- reprise sur le haut -->
    <path d="M18 12.5 C 24 11.8 30 11.5 35 12" stroke-width="1.3" opacity=".55"/>
    <!-- lignes parlées, pression variable -->
    <path d="M19 19 C 26 18 33 19 39 19" stroke-width="2.6"/>
    <path d="M19 26 C 24 27 29 26 34 27" stroke-width="1.8"/>
    <!-- bulle du candidat -->
    <path d="M56 24.8 C 65 23.7 75.5 23.8 84.5 26.2 C 86.5 33.8 86.3 42 83.5 49.2" stroke-width="3.4"/>
    <path d="M84.8 47.5 C 77 51.3 65 51.5 55.5 49.3 C 52.8 42.3 52.9 33.5 54.8 26" stroke-width="2.2"/>
    <path d="M77 50 L 83 58 L 71 51" stroke-width="2.4"/>
    <!-- point d'interrogation appuyé, en terracotta -->
    <g stroke="#c36648" stroke-width="2.8">
      <path d="M64 33 C 64 28 74 28 73 33 C 72 37 69 36 69 40"/>
      <path d="M69 45 L 69 45.5"/>
    </g>
    <!-- hachures d'ombre sous la bulle du jury -->
    <path d="M30 41 L 34 39 M37 41.5 L 41 39.5" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
