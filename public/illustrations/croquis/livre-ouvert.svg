    <path d="M23 26 C 29 24 36 25 41 26" stroke-width="2.6"/>
    <path d="M23 34 C 29 33 35 34 41 35" stroke-width="1.8"/>
    <path d="M55 26 C 61 25 68 24 74 26" stroke-width="2.6"/>
    <path d="M55 35 C 61 34 67 33 73 34" stroke-width="1.8"/>
    <path d="M55 39.5 C 60 38.8 65 38.5 70 39" stroke-width="2.6" stroke="#c36648"/>
    <!-- hachures d'ombre sous le livre -->
    <path d="M28 61 L 32 59 M35 61.5 L 39 59.5 M42 61 L 46 59" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
