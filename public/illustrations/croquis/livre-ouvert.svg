<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Un livre ouvert.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- page de gauche : traits séparés qui se croisent -->
    <path d="M48.5 16 C 40 8.5 26 8.5 14.5 12.8" stroke-width="3.4"/>
    <path d="M15.5 11 C 14.2 25 14.2 39.5 15.3 53.5" stroke-width="2.2"/>
    <path d="M13.5 52.5 C 24.5 48.3 39 49.3 48.5 55.8" stroke-width="3.2"/>
    <!-- page de droite -->
    <path d="M47.5 16 C 55.5 8.5 70 8.5 81.5 12.8" stroke-width="2.4"/>
    <path d="M80.5 11 C 81.8 25 81.8 39.5 80.7 53.5" stroke-width="3.4"/>
    <path d="M82.5 52.5 C 71.5 48.3 57 49.3 47.5 55.8" stroke-width="2.2"/>
