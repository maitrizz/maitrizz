<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Un signe plus et un signe égal.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- le plus : deux traits appuyés qui se croisent franchement -->
    <path d="M30 14.5 C 30 25 30 35.5 30 47.5" stroke-width="3.6"/>
    <path d="M13.5 31 C 24 31 34.5 30 46.5 31" stroke-width="2.6"/>
    <!-- reprise sur le montant du plus -->
    <path d="M30.5 20 C 30.3 26 30.5 32 30.4 38" stroke-width="1.3" opacity=".55"/>
    <!-- le égal, en terracotta, pression variable -->
    <path d="M57 25 C 65.5 24 74 25 83 25" stroke="#c36648" stroke-width="3.2"/>
    <path d="M57 38 C 65.5 39 74 38 83 38" stroke="#c36648" stroke-width="2.4"/>
    <!-- hachures d'ombre sous le égal -->
    <path d="M62 45.5 L 66 43.5 M69 46 L 73 44" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
