<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Une loupe sur une phrase.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- lignes de texte -->
    <path d="M8 22 C 18 21 29 22.5 40 21.5" stroke-width="2.6"/>
    <path d="M8 32 C 16 33 24 31.5 33 32.5" stroke-width="1.8"/>
    <path d="M8 42 C 17 42 26 43 36 42" stroke-width="2.6"/>
    <!-- verre : deux passages de cercle qui ne se referment pas exactement -->
    <path d="M62 12 C 51 13 43.5 22 44.5 33 C 45.5 43.5 54 51 64 50.5" stroke-width="3.4"/>
    <path d="M63 50.8 C 74 50 81.5 40.5 80.5 30 C 79.5 20 71.5 12 62.5 12.3" stroke-width="2.4"/>
    <!-- reflet -->
    <path d="M53 21 C 55.5 18.5 59 17 62 17" stroke-width="1.4" opacity=".5"/>
    <!-- manche épais, deux traits -->
    <path d="M55 47 C 49 53 42.5 59.5 36 65" stroke-width="3.6"/>
    <path d="M58.5 50.5 C 52.5 56 46.5 61.5 40.5 67" stroke-width="3.6"/>
    <path d="M36 65 C 37 66.5 39 67.5 40.5 67" stroke-width="2.2"/>
    <!-- mot repéré dans le verre -->
    <path d="M54 33 C 58 32 63 33 68 32.2" stroke-width="2.8" stroke="#c36648"/>
    <!-- hachures d'ombre du verre -->
    <path d="M72 44 L 75.5 40.5 M75 46.5 L 78.5 43" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
