<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Une plume qui écrit une ligne.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- la plume : deux passages qui ne se referment pas exactement -->
    <path d="M38 50.5 C 44 34 56 19.5 74.5 11.5" stroke-width="3.4"/>
    <path d="M73 12.5 C 69.5 24.5 61.5 36.5 49.5 46.5 C 45.8 49.3 42 50.4 38.5 50.3" stroke-width="2.4"/>
    <!-- la nervure, plus légère -->
    <path d="M39 49 C 48.5 35.5 58 25 68 17" stroke-width="1.8"/>
    <!-- barbes esquissées -->
    <path d="M50 38 L 55 40 M56 31 L 61 33 M62 24 L 66.5 26" stroke-width="1.2" opacity=".5"/>
    <!-- le bec, appuyé -->
    <path d="M39 49 L 29.5 58.5" stroke-width="3.2"/>
    <!-- reprise sur le bord de la plume -->
    <path d="M41 45 C 43.5 39.5 46.5 34.5 50 29.5" stroke-width="1.3" opacity=".55"/>
    <!-- la ligne écrite, en terracotta -->
    <path d="M18 61 C 34 62 52 62 70 61" stroke="#c36648" stroke-width="2.8"/>
    <!-- hachures d'ombre sous la plume -->
    <path d="M46 56 L 50 54 M53 56.5 L 57 54.5" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
