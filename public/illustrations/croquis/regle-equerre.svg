<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Une équerre et une règle.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- équerre : trois traits qui se croisent aux sommets -->
    <path d="M20 9.5 C 20 21.5 20 34 20 47.5" stroke-width="3.4"/>
    <path d="M17 45 C 29 45 41.5 45 54.5 45" stroke-width="2.2"/>
    <path d="M18.8 13.5 C 29.8 24 41 34.5 53 45.8" stroke-width="3.2"/>
    <!-- reprise sur le montant -->
    <path d="M20.5 17 C 20.3 25 20.5 33 20.3 40" stroke-width="1.3" opacity=".55"/>
    <!-- triangle intérieur, plus léger -->
    <path d="M27 27 C 27 31 27 35 27 38.5 C 31 38.5 35 38.5 38.5 38.5 C 34.5 34.5 31 31 27 27 Z" stroke-width="1.8"/>
    <!-- règle : deux longs traits épais, bouts fins -->
    <path d="M55.5 55.5 C 65.5 45.5 75.5 35.5 85.5 25.5" stroke-width="3.4"/>
    <path d="M62.5 61.5 C 72.5 51.5 82.5 41.5 92.5 31.5" stroke-width="3.4"/>
    <path d="M55 54.5 L 63.5 62" stroke-width="2.2"/>
    <path d="M85.5 24.5 L 93.5 31.5" stroke-width="2.2"/>
    <!-- graduations en terracotta -->
    <g stroke="#c36648" stroke-width="2.2">
      <path d="M66 45 L 70 49"/>
      <path d="M74 37 L 78 41"/>
      <path d="M82 29 L 86 33"/>
    </g>
    <!-- hachures d'ombre sous l'équerre -->
    <path d="M24 51 L 28 49 M31 51.5 L 35 49.5 M38 51 L 42 49" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
