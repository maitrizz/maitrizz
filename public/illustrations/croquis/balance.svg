<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Une balance à deux plateaux.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- le pied épais, le socle plus fin qui dépasse -->
    <path d="M48 11 C 48 25.5 48 42 48 55" stroke-width="3.4"/>
    <path d="M34.5 58 C 43.5 60.2 52.5 60.2 61.5 58" stroke-width="2.2"/>
    <!-- le fléau, trait appuyé qui dépasse du pied -->
    <path d="M19 18 C 38.5 14.8 57.5 14.8 77 18" stroke-width="3.2"/>
    <!-- reprise sur le fléau -->
    <path d="M30 16.5 C 42 14.8 54 14.8 66 16.3" stroke-width="1.3" opacity=".55"/>
    <!-- les fils des plateaux, légers -->
    <path d="M20 18 L 14 34 M20 18 L 26 34" stroke-width="1.8"/>
    <path d="M76 18 L 70 34 M76 18 L 82 34" stroke-width="1.8"/>
    <!-- les plateaux, en terracotta -->
    <path d="M10 35 C 16 39 24 39 30 35" stroke="#c36648" stroke-width="2.8"/>
    <path d="M66 35 C 72 39 80 39 86 35" stroke="#c36648" stroke-width="2.8"/>
    <!-- hachures d'ombre sous le socle -->
    <path d="M40 64 L 44 62 M47 64.5 L 51 62.5 M54 64 L 58 62" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
