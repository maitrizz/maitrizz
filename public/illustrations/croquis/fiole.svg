<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Une fiole de laboratoire.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- buvant, trait qui dépasse -->
    <path d="M37.5 8 C 43.5 9.2 52.5 9.2 58.5 8" stroke-width="3.2"/>
    <!-- col : deux traits d'épaisseur différente -->
    <path d="M42 9 L 42 24.5" stroke-width="2.2"/>
    <path d="M54 9 L 54 24.5" stroke-width="3.2"/>
    <!-- corps : flancs épais, base plus légère, angles qui se croisent -->
    <path d="M42.5 23 C 36.5 36.5 30.5 48 27 56" stroke-width="3.4"/>
    <path d="M53.5 23 C 59.5 36.5 65.5 48 69 56" stroke-width="3.4"/>
    <path d="M26 54 C 27.5 58.5 30.8 61 35 61 C 44 62 54 61 61 61 C 65.2 61 68.5 58.5 70 54" stroke-width="2.2"/>
    <!-- reprise sur le flanc gauche -->
    <path d="M40 30 C 38 34.5 36 39 34.2 43" stroke-width="1.3" opacity=".55"/>
    <!-- le liquide et ses bulles, en terracotta -->
    <g stroke="#c36648">
      <path d="M33 46 C 41 44 55 45 63 46" stroke-width="2.8"/>
      <circle cx="44" cy="38" r="2.5" stroke-width="2"/>
      <circle cx="52" cy="30" r="2" stroke-width="2"/>
    </g>
    <!-- hachures d'ombre sous la fiole -->
    <path d="M38 65.5 L 42 63.5 M45 66 L 49 64 M52 65.5 L 56 63.5" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
