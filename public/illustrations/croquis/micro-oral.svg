<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-label="Un micro sur pied qui diffuse la voix.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- le pied du micro, épais, socle plus fin qui dépasse -->
    <path d="M120 113.5 C 120 96.5 120 78 120 61" stroke-width="3.4"/>
    <path d="M102 116 C 113 119.3 127 119.3 140 116" stroke-width="2.2"/>
    <path d="M111 112 C 116.5 113.2 123.5 113.2 130 112" stroke-width="2.4"/>
    <!-- reprise sur le pied -->
    <path d="M120.6 70 C 120.4 82 120.6 94 120.5 104" stroke-width="1.3" opacity=".55"/>
    <!-- les ondes de la voix, pression variable -->
    <g stroke-dasharray="1 7">
      <path d="M143 40 C 148 45 148 54 143 59" stroke-width="2.6"/>
      <path d="M153 33 C 161 41 161 57 153 65" stroke-width="1.8"/>
      <path d="M97 40 C 92 45 92 54 97 59" stroke-width="2.6"/>
      <path d="M87 33 C 79 41 79 57 87 65" stroke-width="1.8"/>
    </g>
    <!-- hachures d'ombre sous le socle -->
    <path d="M106 123 L 114 119 M120 124 L 128 120" stroke-width="1.4" opacity=".45"/>
  </g>
  <!-- la capsule terracotta, seul accent -->
  <path d="M109 52 C 106 42 114 34 121 35 C 129 36 133 45 129 53 C 126 59 117 60 112 57 C 110 56 109 54 109 52 Z" fill="#c36648"/>
  <path d="M114 60 C 116 62 124 62 126 60" fill="none" stroke="#0c434e" stroke-width="2.5" stroke-linecap="round"/>
</svg>
