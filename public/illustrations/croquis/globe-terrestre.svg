<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Un globe terrestre de classe sur son pied.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- sphère : deux arcs qui ne se referment pas exactement -->
    <path d="M48 9 C 37.5 9.3 28.5 17.5 28.2 28.5 C 28 38.5 35.5 47.5 45.5 49" stroke-width="3.4"/>
    <path d="M43 48.7 C 54 51 65.5 43.5 67.3 32.5 C 69 21.5 61.5 10.8 50.5 9.3" stroke-width="2.4"/>
    <!-- reprise en haut de la sphère -->
    <path d="M41 11.5 C 44.5 10.3 48.5 10 52 10.6" stroke-width="1.3" opacity=".5"/>
    <!-- méridien, plus léger -->
    <path d="M48 9 C 39 14 39 44 48 49" stroke-width="1.8"/>
    <!-- équateur -->
    <path d="M28.5 31 C 36 34.5 60 34.5 67.5 31" stroke-width="2.4"/>
    <!-- continent esquissé en terracotta, trait appuyé -->
    <path d="M52 18 C 56 17 60 19 61 23 C 58 25 54 24 52 21 Z" stroke="#c36648" stroke-width="2.6"/>
    <!-- pied épais, socle plus fin qui dépasse -->
    <path d="M48 49 L 48 57.5" stroke-width="3.2"/>
    <path d="M34.5 60.5 C 41.5 58.8 54.5 58.8 61.5 60.5" stroke-width="2.2"/>
    <!-- hachures d'ombre sous le socle -->
    <path d="M40 64.5 L 44 62.5 M47 65 L 51 63 M54 64.5 L 58 62.5" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
