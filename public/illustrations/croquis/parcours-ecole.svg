<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 170" role="img" aria-label="Un chemin en deux étapes qui mène à l'école.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- l'école : murs épais qui croisent le toit -->
    <path d="M330 131 C 329 112.5 330 94 331 74.5" stroke-width="3.4"/>
    <path d="M393 74.5 C 392 93 392.5 112.5 393 131" stroke-width="3.4"/>
    <path d="M329 76.5 C 350.5 75.3 371.5 76.3 394.5 75.3" stroke-width="2.2"/>
    <!-- le toit : deux versants qui se croisent au faîte -->
    <path d="M320 78.5 C 333.5 67.5 348 57 362.5 46" stroke-width="3.2"/>
    <path d="M359.5 46.5 C 373.5 56.7 387 66.8 402 77.5" stroke-width="2.4"/>
    <!-- reprise sur le mur gauche -->
    <path d="M330.6 84 C 330.3 97 330.6 110 330.5 122" stroke-width="1.3" opacity=".55"/>
    <!-- la porte, plus légère -->
    <path d="M352 130 C 352 118 352 110 353 104 C 359 98 367 98 372 104 C 373 110 373 118 373 130" stroke-width="2.2"/>
    <!-- le sol, trait qui dépasse -->
    <path d="M308 132.5 C 340 134.8 375 133.8 408 132.5" stroke-width="2.2"/>
    <!-- le mât du fanion -->
    <path d="M361 47 L 361 28.5" stroke-width="2.4"/>
    <!-- les deux drapeaux d'étape plantés sur le chemin -->
    <path d="M138 148 C 138 139.5 138 131 139 122" stroke-width="3.2"/>
    <path d="M139 123 C 145 124 151 126 156 128 C 151 131 145 133 139 134" stroke-width="2.2"/>
    <path d="M248 139 C 248 130.5 248 122 249 113" stroke-width="3.2"/>
    <path d="M249 114 C 255 115 261 117 266 119 C 261 122 255 124 249 125" stroke-width="2.2"/>
    <!-- hachures d'ombre au pied des drapeaux et de l'école -->
    <path d="M128 152 L 136 148 M144 153 L 152 149" stroke-width="1.4" opacity=".45"/>
    <path d="M340 138 L 348 134 M354 139 L 362 135" stroke-width="1.4" opacity=".45"/>
  </g>
  <!-- le fanion terracotta de l'école, seul accent -->
  <path d="M361 29 C 368 30 375 32 381 34 C 375 37 368 38 361 39 Z" fill="#c36648"/>
  <!-- le chemin pointillé -->
  <path d="M24 152 C 100 150 180 145 260 136 C 290 133 320 130 348 128" fill="none" stroke="#0c434e" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 10"/>
  <circle cx="18" cy="153" r="4" fill="#0c434e"/>
</svg>
