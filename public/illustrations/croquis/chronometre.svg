<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Un chronomètre.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- bouton -->
    <path d="M42 7.5 C 46 6.5 50.5 6.5 54.5 7.8" stroke-width="3.2"/>
    <path d="M48 8 L 48.3 14" stroke-width="2.4"/>
    <!-- boîtier : deux arcs qui se chevauchent -->
    <path d="M48 14 C 35 14.5 25.5 25 26.5 38 C 27.2 48 34 56.5 44 59.3" stroke-width="3.4"/>
    <path d="M42 59.5 C 53.5 62 66 55 69.3 43.5 C 72.5 32 66.5 18.5 54 14.8" stroke-width="2.4"/>
    <!-- reprise sur le haut -->
    <path d="M38 17.5 C 42 15.5 46 14.8 50 15" stroke-width="1.3" opacity=".5"/>
    <!-- aiguille appuyée -->
    <path d="M48 38 C 52 34.5 55.5 30.8 59.5 26.5" stroke-width="3.6"/>
    <!-- arc de temps écoulé -->
    <path d="M48 20 C 55.5 20.5 61.5 26 63.5 33" stroke-width="2.6" stroke="#c36648"/>
    <!-- graduations irrégulières -->
    <path d="M48 18.5 L 48 23" stroke-width="2.4"/>
    <path d="M65.5 38 L 61 38.2" stroke-width="2.4"/>
    <path d="M48 55.5 L 48.2 51" stroke-width="2.4"/>
    <path d="M30.5 38 L 35 37.8" stroke-width="2.4"/>
    <!-- hachures d'ombre -->
    <path d="M56 61 L 59.5 58 M61 60 L 64 57" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
