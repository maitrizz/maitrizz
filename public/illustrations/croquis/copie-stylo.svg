<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 68" role="img" aria-label="Une copie et un stylo.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- feuille : traits séparés qui se croisent aux coins -->
    <path d="M14 8 C 13.5 25 14.5 44 15.5 62" stroke-width="3.2"/>
    <path d="M12 10.5 C 27 9.5 42 10.5 59 9.5" stroke-width="2.2"/>
    <path d="M57 7.5 C 58 24 57 42 58 63" stroke-width="3.2"/>
    <path d="M13 60.5 C 28 62 44 60.5 60 61.5" stroke-width="2.2"/>
    <!-- reprise de trait (double passage) sur le bord gauche -->
    <path d="M15.5 14 C 15 24 15.5 33 15.2 41" stroke-width="1.3" opacity=".55"/>
    <!-- lignes écrites, pression variable -->
    <path d="M23 21 C 30 20 38 21.5 47 20.5" stroke-width="2.6"/>
    <path d="M23 29 C 31 30 40 28.5 50 29.5" stroke-width="1.8"/>
    <path d="M23 37 C 29 37 36 38 42 37" stroke-width="2.6"/>
    <!-- stylo posé en travers, corps épais -->
    <path d="M51 55 C 61 45 71 35 81 25" stroke-width="3.4"/>
    <path d="M58 61 C 68 51 78 41 87 32" stroke-width="3.4"/>
    <path d="M81 25 C 84.5 21.5 89 25.5 87 32" stroke-width="2.2"/>
    <path d="M51 55 L 45.5 64.5 L 58 61" stroke-width="2.2"/>
    <path d="M47.5 61.5 L 50 63.5" stroke-width="3.4"/>
    <!-- hachures d'ombre sous la feuille -->
    <path d="M20 65.5 L 24 63.5 M27 66 L 31 64 M34 65.5 L 38 63.5" stroke-width="1.2" opacity=".45"/>
  </g>
</svg>
