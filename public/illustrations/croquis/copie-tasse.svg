<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" role="img" aria-label="Une copie en cours de rédaction et une tasse fumante.">
  <g fill="none" stroke="#0c434e" stroke-linecap="round" stroke-linejoin="round">
    <!-- la copie : bords qui se croisent aux coins -->
    <path d="M72 23.5 C 70.5 55 70.5 85 73 116.5" stroke-width="3.4"/>
    <path d="M70 26.5 C 93 25 116 25 141.5 26.5" stroke-width="2.2"/>
    <path d="M139 24 C 141.5 55 140.5 85 139.5 116.5" stroke-width="3.4"/>
    <path d="M70.5 113.5 C 93.5 116 117.5 116 141.5 113.5" stroke-width="2.2"/>
    <!-- reprise sur le bord gauche -->
    <path d="M72.5 35 C 71.8 55 72 75 72.3 95" stroke-width="1.3" opacity=".55"/>
    <!-- la marge, filet léger -->
    <path d="M86 26 C 86 55 86 85 87 114" stroke-width="1.8"/>
    <!-- les lignes écrites, pression variable -->
    <path d="M95 44 C 106 43 117 44 129 44" stroke-width="2.6"/>
    <path d="M95 57 C 105 58 116 57 128 58" stroke-width="1.8"/>
    <path d="M95 70 C 106 69 116 70 127 70" stroke-width="2.6"/>
    <path d="M95 83 C 105 83 115 84 125 83" stroke-width="1.8"/>
    <path d="M95 96 C 102 96 109 97 116 96" stroke-width="2.6"/>
    <!-- la vapeur, très légère -->
    <path d="M181 74 C 179 68 185 64 183 58" stroke-width="1.8" opacity=".7"/>
    <path d="M193 74 C 191 68 197 64 195 58" stroke-width="1.8" opacity=".7"/>
    <!-- le sol -->
    <path d="M161 114.5 C 178 116.5 197 116.5 214 114.5" stroke-width="1.8"/>
    <!-- hachures d'ombre sous la tasse -->
    <path d="M175 121 L 183 117 M189 122 L 197 118" stroke-width="1.4" opacity=".45"/>
  </g>
  <!-- la tasse terracotta, seul accent -->
  <path d="M173 84 C 173 96 177 107 187 108 C 197 107 201 96 201 84 C 192 82 182 82 173 84 Z" fill="#c36648"/>
  <path d="M201 88 C 209 87 211 99 200 101" fill="none" stroke="#c36648" stroke-width="2.5" stroke-linecap="round"/>
</svg>
