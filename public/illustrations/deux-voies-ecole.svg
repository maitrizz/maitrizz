<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img" aria-label="Deux chemins qui mènent à la même école.">
  <g fill="none" stroke="#0c434e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- corps de l'école, trait légèrement irrégulier -->
    <path d="M167 141 C 166 118 167 96 168 74 C 196 73 224 74 252 73 C 253 95 252 118 253 140"/>
    <!-- toit débordant -->
    <path d="M156 76 C 174 62 192 48 210 36 C 228 49 246 62 264 75"/>
    <!-- porte en arche -->
    <path d="M196 140 C 196 127 196 116 197 108 C 205 101 215 101 223 108 C 224 116 224 127 224 140"/>
    <!-- fenêtres -->
    <path d="M176 90 L 190 89 L 190 102 L 177 103 Z"/>
    <path d="M230 89 L 244 90 L 243 103 L 230 102 Z"/>
    <!-- sol, deux traits interrompus -->
    <path d="M140 142 C 165 144 195 143 218 143"/>
    <path d="M228 143 C 246 142 264 143 282 142"/>
    <!-- mât du drapeau -->
    <path d="M210 36 L 210 18"/>
  </g>
  <!-- fanion terracotta, seul accent -->
  <path d="M210 18 C 219 19 228 21 236 24 C 228 27 219 29 210 30 Z" fill="#c36648"/>
  <!-- les deux chemins, pointillés, qui convergent vers la porte -->
  <g fill="none" stroke="#0c434e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 10">
    <path d="M38 204 C 78 196 122 186 152 172 C 172 162 186 152 196 143"/>
    <path d="M382 204 C 342 196 298 186 268 172 C 248 162 234 152 224 143"/>
  </g>
  <!-- points de départ -->
  <circle cx="32" cy="205" r="4" fill="#0c434e"/>
  <circle cx="388" cy="205" r="4" fill="#0c434e"/>
</svg>
